name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # index.html (en) + ru.html + 404.html + assets/ are the site. Keep the CSVs / ruvector.db / other HTML out of prod.
      # Pages serves 404.html itself for unmatched paths, so it has to be staged like any other page.
      - name: Stage site
        run: |
          mkdir -p dist
          cp index.html ru.html 404.html dist/
          cp -R assets dist/

      - name: Deploy to Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CF_TOKEN != '' }}          # skips cleanly until the secret is added
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 29998953ea0b0472512f509064785c3f
          command: pages deploy dist --project-name=dmitrijs-dev --branch=main
